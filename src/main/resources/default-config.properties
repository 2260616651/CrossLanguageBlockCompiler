# ===== 两级日志 =====
# 主日志级别：DEBUG | INFO | WARN | ERROR
log.level=DEBUG
# ===== 主题与个性化（深色/浅色；壁纸/音乐仅存用户指定路径，程序不携带素材）=====
# 界面主题：深色 | 浅色（代码编辑器恒深色不受此影响）
ui.theme=深色
# 背景壁纸本地路径（留空=纯色底）
ui.wallpaper=
# 背景音乐本地路径（留空=不播放；建议 WAV/AU/AIFF，JDK 原生支持）
ui.bgm=
# 背景音乐音量 0.0~1.0
ui.bgm.volume=0.6
# ===== Scratch 风格 JDK 库扩展（false = 从工具箱移除该库积木，不影响代码生成）=====
ext.jdk.lang=true
ext.jdk.util=true
ext.jdk.math=true
ext.jdk.io=true
ext.jdk.charset=true
ext.jdk.net=true
ext.jdk.time=true
ext.jdk.text=true
ext.jdk.concurrent=true
ext.jdk.regex=true
ext.jdk.stream=true
ext.jdk.zip=true
